[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hdhcounsel"
version = "0.1.0"
description = "Local Korean counseling transcription and review"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.56,<2", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
speech = ["whisperx==3.8.6"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
legacy = ["pyperclip", "send2trash", "requests"]

[project.scripts]
hdhcounsel = "hdhcounsel.cli:main"

[tool.setuptools.packages.find]
include = ["hdhcounsel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
